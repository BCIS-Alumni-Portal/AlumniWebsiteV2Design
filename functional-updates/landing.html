<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCIS Alumni Network — Welcome</title>
<style>
  :root{
    --accent:#A42D2D; --accent-dim:#8C2424;
    --dot:#E24B4A; --cream:#FBF6F0; --ink:#1A1714;
    --ease:cubic-bezier(0.16,1,0.3,1);
    --page-x:clamp(24px,5vw,64px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Gotham','Gotham SSm',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:#160c0c; color:#fff; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .hero{position:relative;width:100%;height:100vh;min-height:600px;overflow:hidden;}

  .hero-photo{
    position:absolute;inset:0;background-color:#160c0c;
    background-image:url('../assets/background.jpeg');
    background-size:cover;background-position:center;background-repeat:no-repeat;
  }
  .hero-scrim{
    position:absolute;inset:0;z-index:1;
    background:
      linear-gradient(105deg, rgba(16,7,9,0.9) 0%, rgba(16,7,9,0.62) 40%, rgba(18,8,11,0.44) 72%, rgba(18,8,11,0.4) 100%),
      radial-gradient(120% 92% at 0% 62%, rgba(164,45,45,0.44), rgba(164,45,45,0) 52%),
      linear-gradient(0deg, rgba(12,5,7,0.72) 0%, rgba(12,5,7,0.08) 52%);
  }

  /* ── Pixel world-map (from map.svg) ──────────── */
  .pixelmap{position:absolute;inset:0;z-index:2;}
  .pixelmap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

  .home-ring{
    position:absolute;z-index:3;width:24px;height:24px;border-radius:50%;
    border:2px solid var(--cream);pointer-events:none;opacity:0;
  }
  @keyframes homepulse{
    0%{transform:scale(.55);opacity:.7;}
    70%{opacity:0;}
    100%{transform:scale(2.7);opacity:0;}
  }
  .home-ring.animate{animation:homepulse 2.4s var(--ease) infinite;}
  .home-label{
    position:absolute;z-index:4;font-size:11px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--cream);white-space:nowrap;pointer-events:none;opacity:0;
    text-shadow:0 1px 5px rgba(0,0,0,.55);transition:opacity .6s var(--ease);
  }
  .home-label.show{opacity:.92;}

  /* ── Brand lockup (logo.svg, recolored for dark hero) ── */
  .brand-logo{
    position:absolute;z-index:5;top:clamp(20px,4vh,38px);left:var(--page-x);
    height:44px;line-height:0;
  }
  .brand-logo svg{height:100%;width:auto;display:block;}
  .brand-logo svg path:not([class]),
  .brand-logo svg rect,
  .brand-logo svg .cls-2,
  .brand-logo svg text.cls-2{fill:#fff;}
  .brand-logo svg .cls-3,
  .brand-logo svg .cls-4{fill:var(--dot);}

  /* ── Hero content ────────────────────────────── */
  .hero-content{
    position:absolute;z-index:4;left:var(--page-x);top:50%;transform:translateY(-50%);
    max-width:540px;pointer-events:none;
  }
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.24em;color:#EDB4B4;margin-bottom:20px;}
  .hero-title{
    font-size:clamp(48px,7.2vw,84px);line-height:.92;letter-spacing:-.03em;
    font-weight:800;text-transform:uppercase;color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.5), 0 1px 4px rgba(0,0,0,.35);
  }
  .hero-rule{width:52px;height:2px;background:var(--accent);margin:26px 0 18px;}
  .hero-sub{font-size:clamp(14px,1.4vw,16px);line-height:1.55;color:rgba(255,255,255,.84);max-width:360px;}
  .cta{
    margin-top:32px;display:inline-flex;align-items:center;gap:10px;pointer-events:auto;
    background:var(--cream);color:var(--ink);font-size:15px;font-weight:700;
    padding:16px 30px;border-radius:44px;text-decoration:none;
    transition:transform .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease), color .25s var(--ease);
    box-shadow:0 10px 30px -12px rgba(0,0,0,.6);
  }
  .cta:hover{transform:translateY(-3px);background:var(--accent);color:var(--cream);box-shadow:0 18px 42px -12px rgba(164,45,45,.65);}
  .cta .arrow{color:var(--accent);transition:transform .25s var(--ease), color .25s var(--ease);}
  .cta:hover .arrow{transform:translateX(5px);color:var(--cream);}

  /* ── Landing animation (enabled via .anim-on on <html>) ── */
  @keyframes logoIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:none;}}
  html.anim-on .brand-logo{opacity:0;animation:logoIn .8s var(--ease) .2s forwards;}
  html.anim-on .hero-content .eyebrow,
  html.anim-on .hero-content .hero-title,
  html.anim-on .hero-content .hero-rule,
  html.anim-on .hero-content .hero-sub,
  html.anim-on .hero-content .cta{
    opacity:0;transform:translateY(22px);
    transition:opacity .7s var(--ease), transform .7s var(--ease);
  }
  html.anim-on .hero-content.show .eyebrow{opacity:1;transform:none;transition-delay:0s;}
  html.anim-on .hero-content.show .hero-title{opacity:1;transform:none;transition-delay:.09s;}
  html.anim-on .hero-content.show .hero-rule{opacity:1;transform:none;transition-delay:.22s;}
  html.anim-on .hero-content.show .hero-sub{opacity:1;transform:none;transition-delay:.29s;}
  html.anim-on .hero-content.show .cta{opacity:1;transform:none;transition-delay:.38s;}

  /* ── Responsive: no map / no interactions on mobile ── */
  @media (max-width:680px){
    .pixelmap,.home-ring,.home-label{display:none !important;}
    .hero-content{top:auto;bottom:clamp(40px,10vh,90px);transform:none;max-width:none;right:var(--page-x);}
    .hero-sub{max-width:100%;}
    .cta{display:flex;justify-content:center;}
    .brand-logo{height:38px;}
    .hero-scrim{background:
      radial-gradient(130% 80% at 0% 70%, rgba(164,45,45,0.5), rgba(164,45,45,0) 60%),
      linear-gradient(0deg, rgba(12,5,7,0.92) 0%, rgba(12,5,7,0.2) 55%, rgba(12,5,7,0) 100%);}
  }

  @media (prefers-reduced-motion:reduce){
    .home-ring.animate{animation:none;}
  }
</style>
</head>

  var hoverOpacityArmed=false;
  function mixCol(k){                          /* DOT(226,75,74) -> CREAM(251,246,240) */
    return 'rgb('+((226+25*k)|0)+','+((75+171*k)|0)+','+((74+166*k)|0)+')';
  }
  function hasLandHover(){
    if(mx===null) return false;
    for(var i=0;i<n;i++){
      var dx=px(i)-mx, dy=py(i)-my;
      if(dx*dx+dy*dy < HIT_R2) return true;
    }
    return false;
  }
  function drawBaked(alpha){
    mapAlpha=alpha;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.globalAlpha=1; ctx.clearRect(0,0,W,H);
    ctx.globalAlpha=alpha;
    ctx.drawImage(off,0,0,off.width,off.height,0,0,W,H);
    ctx.globalAlpha=1;
  }
  function easeMapAlpha(target){
    mapAlpha += (target-mapAlpha)*OPACITY_EASE;
    if(Math.abs(target-mapAlpha)<0.01) mapAlpha=target;
    drawBaked(mapAlpha);
    return mapAlpha!==target;
  }
  function hoverFrame(){
    if(!baked){ hoverRAF=false; return; }
    var landHover=hasLandHover();
    if(landHover) hoverOpacityArmed=true;
    var alphaMoving=easeMapAlpha(hoverOpacityArmed ? (landHover?1:MAP_DIM) : 1);
    var active=false;
    for(var i=0;i<n;i++){
      if(i===HOME) continue;
      var target=0;
      if(landHover){
        var dx=px(i)-mx, dy=py(i)-my, d2=dx*dx+dy*dy;
        if(d2<R2){ var u=1-Math.sqrt(d2)/R; target=u*u*(3-2*u); }   /* smoothstep falloff */
      }
      var cur=intensity[i];
      cur += (target-cur)*(target>cur?0.30:0.14);      /* ease in fast, out slow */
      if(cur<0.005){ intensity[i]=0; continue; }
      intensity[i]=cur; active=true;
      var op=base[i]+(1-base[i])*cur;                   /* identical response for every dot */
      var ck=cur>0.35?(cur-0.35)/0.65:0;
      drawDot(ctx,px(i),py(i),R_HEX*scale*(1+0.85*cur), mixCol(ck), op>1?1:op);
    }
    ctx.globalAlpha=1;
    if(active || alphaMoving){ requestAnimationFrame(hoverFrame); } else { hoverRAF=false; drawBaked(mapAlpha); }
  }
  function kickHover(){ if(baked && !hoverRAF){ hoverRAF=true; requestAnimationFrame(hoverFrame); } }
  if(!reduce){
    pm.addEventListener('pointermove',function(e){
      if(e.pointerType==='touch') return;
      var b=pm.getBoundingClientRect();
      mx=e.clientX-b.left; my=e.clientY-b.top; kickHover();
    });
    pm.addEventListener('pointerleave',function(){ mx=null; kickHover(); });
  }

  /* ── Home pulse + label ── */
  function placeHome(){
    if(scale===undefined) return;
    var hx=px(HOME), hy=py(HOME);
    ringEl.style.left=(hx-12)+'px'; ringEl.style.top=(hy-12)+'px';
    ringEl.style.opacity=1; if(!reduce) ringEl.classList.add('animate');
    lblEl.style.left=(hx+16)+'px'; lblEl.style.top=(hy-7)+'px';
    lblEl.classList.add('show');
  }

  var rz;
  window.addEventListener('resize',function(){
    clearTimeout(rz);
    rz=setTimeout(function(){
      resize();
      if(phase==='idle'){ bake(); drawBaked(mapAlpha); }
    },150);
  });

  /* debug hook: paint the settled map (used by tooling/tests) */
  window.__lpPaintFinal=function(){ if(scale===undefined) resize(); drawAllFinal(ctx); };

  /* init after layout is ready (setTimeout also fires in background tabs) */
  setTimeout(function(){
    resize();
    if(reduce){ bake(); drawBaked(1); placeHome(); showText(); return; }
    placeHome();
    requestAnimationFrame(revealFrame);
  },0);
})();
</script>
</body>
</html>
